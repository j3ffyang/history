name: ClawHub Skill Sync

on:
  push:
    branches: [main]
    paths:
      - ".opencode/skills/**"
      - ".github/workflows/clawhub-skill-sync.yml"
  pull_request:
    paths:
      - ".opencode/skills/**"
  workflow_dispatch:

jobs:
  dry-run:
    if: github.event_name == 'pull_request' && github.repository_owner == 'j3ffyang'
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.23.3
    with:
      skill_path: .opencode/skills/zh-culture
      dry_run: true

  publish:
    if: github.event_name != 'pull_request' && github.repository_owner == 'j3ffyang'
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.23.3
    with:
      skill_path: .opencode/skills/zh-culture
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.clawhub_token }}
